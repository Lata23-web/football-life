function startH(){return `<h1>⚽ Carrera de Futbolista</h1><p class="mu">Empieza en 3ª RFEF y llega a lo más alto. Controla a tu jugador en las jugadas clave de cada partido.</p><div class="c"><h2>Nombre</h2><input maxlength="20" value="${esc(dn)}" oninput="dn=this.value" placeholder="Nombre del jugador"><h2 style="margin-top:12px">Dorsal (1–99)</h2><input type="number" min="1" max="99" value="${esc(dnum)}" oninput="dnum=this.value"></div><div class="c"><h2>Posición</h2>${Object.keys(POS).map(p=>`<button class="${p===selPos?'sel':''}" onclick="selPos='${p}';render()">${POS[p]}</button>`).join('')}</div><div class="c"><h2>Club de inicio (3ª RFEF)</h2><select onchange="selC=+this.value"><option value="-1">Aleatorio</option>${TEAMS[4].map((n,i)=>`<option value="${i}" ${i===selC?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="c"><h2>Dificultad</h2><div class="tabs">${DN.map((n,i)=>`<button class="${i===selD?'sel':''}" onclick="selD=${i};render()">${n}</button>`).join('')}</div></div><button class="p" onclick="begin()">Empezar carrera</button>`}
function hubH(){const o=oppName(),op=T(o);
return hd()+`<div class="c">${chips()}<div class="mu" style="margin-top:8px">${S.con?'Contrato: '+S.con.yrs+(S.con.yrs===1?' año':' años')+' · '+mny(S.con.sal)+'/año<br>':''}Esta temporada: ${S.sg} goles · ${S.sa} asistencias${S.sn?' · nota media '+(S.sr/S.sn).toFixed(1):''}</div></div><div class="c"><h2>Jornada ${S.wk+1} de ${NJ()}</h2>${stakeBanner()}${S.qual?'<div class="mu">🏆 Clasificado para '+S.qual+' (tras la liga)</div>':''}<div>Rival: <b>${esc(o)}</b> <span class="mu">(nivel ${Math.round(op.s)})</span>${derbi(S.club,o)?' <span class="ok">🔥 '+derbi(S.club,o)+'</span>':''}</div>${S.inj?'<div class="ko">No disponible: no jugarás este partido.</div>':''}<button class="p" onclick="startMatch()">${S.inj?'Ver el partido desde la grada':'Jugar partido'}</button><button onclick="simMatch()">Simular partido</button><button onclick="simMany()">Simular 5 jornadas</button></div><div class="c"><h2>${TIERS[S.tier]}</h2>${tblOf(S.tier,1)}<button onclick="view=S.tier;go('tables')">Ver todas las ligas</button></div><button onclick="go('stats')">Estadísticas</button><button onclick="go('social')">Redes sociales</button><button onclick="go('edit')">Editar personaje</button><button onclick="reset()">Nueva carrera</button>`}
function tablesH(){return `<h1>Clasificaciones</h1><div class="tabs">${TIERS.map((n,t)=>`<button class="${t===view?'sel':''}" onclick="view=${t};render()">${n}</button>`).join('')}</div><div class="c" style="margin-top:12px"><h2>${TIERS[view]}</h2>${tblOf(view)}<div class="mu">↑ ascenso directo · po = play-off (3º–6º) · ↓ descenso</div></div><button class="p" onclick="go('hub')">Volver</button>`}
function statsH(){const H=S.hist,Z=H.reduce((a,x)=>({g:a.g+x.g,a:a.a+x.a,n:a.n+(x.n||0),r:a.r+(x.r||0)*(x.n||0)}),{g:S.sg,a:S.sa,n:S.sn,r:S.sr});
return `<h1>Estadísticas</h1><div class="c"><div class="row"><div class="chip">Partidos<b>${Z.n}</b></div><div class="chip">Goles<b>${Z.g}</b></div><div class="chip">Asist.<b>${Z.a}</b></div><div class="chip">Nota<b>${Z.n?(Z.r/Z.n).toFixed(1):'-'}</b></div></div></div><div class="c"><h2>Por temporada</h2><div class="tw"><table><tr><th>T</th><th>Club</th><th>Pos</th><th>PJ</th><th>G</th><th>A</th><th>Nota</th></tr>${H.map(x=>`<tr><td>${x.s}</td><td>${esc(x.c||'')} <span class="mu">${TIERS[x.t]}</span></td><td>${x.p}º</td><td>${x.n}</td><td>${x.g}</td><td>${x.a}</td><td>${x.r.toFixed(1)}</td></tr>`).join('')}<tr class="me"><td>${S.season}</td><td>${esc(S.club)} <span class="mu">${TIERS[S.tier]}</span></td><td>-</td><td>${S.sn}</td><td>${S.sg}</td><td>${S.sa}</td><td>${S.sn?(S.sr/S.sn).toFixed(1):'-'}</td></tr></table></div></div><div class="c"><h2>Trofeos</h2>${S.trophies.length?S.trophies.map(x=>'<div>🏆 '+esc(x)+'</div>').join(''):'<div class="mu">Aún ninguno</div>'}</div><button class="p" onclick="go('hub')">Volver</button>`}
function introH(){const m=S.m,pl=m.plays[m.i],k=pl.k,
h=k==='penalty'?'Apunta con la cruceta y pulsa Chutar cuando la barra verde indique buena potencia.':k==='freekick'?'Ajusta la dirección y la potencia para superar la barrera.':pl.s==='a'&&S.pos!=='POR'?'Esquiva, dispara o pasa a un compañero. Usa Regate (R) para zafarte de un defensa.':S.pos==='POR'?'Mueve al portero y haz la estirada en el momento justo.':k==='cross'?'Colócate bajo el balón y pulsa Despejar justo cuando llegue.':'Acércate al atacante con balón y pulsa Entrada.';
return `<h2>${esc(S.club)} vs ${esc(m.opp)}${m.eu?' · '+S.eu.n:m.po?' · Play-off':''}${m.derbi?' · 🔥 '+m.derbi:''}</h2><div class="mu">Jugada ${m.i+1} de 3 · Marcador ${m.gf}–${m.ga}</div><div class="c"><div class="mu">Minuto ${pl.m} · ${KN[k]}</div><p>${esc(Q[k])}</p><p class="mu">${h}</p>${livePanel(pl.m)}<button class="p" onclick="S.screen='play';render()">¡Jugar la jugada!</button></div>`}
function playH(){const g=S.m.plays[S.m.i],a=g.s==='a'&&S.pos!=='POR',k=S.pos==='POR',isSp=g.k==='penalty'||g.k==='freekick',lv=liveAt(g.m),B=(t,c,f)=>`<button class="${c}" onclick="${f}">${t}</button>`,
pd=(c,key,sym)=>`<button class="${c}" onpointerdown="pad('${key}',1,event)" onpointerup="pad('${key}',0)" onpointerleave="pad('${key}',0)" onpointercancel="pad('${key}',0)" oncontextmenu="return false">${sym}</button>`;
return `<div class="cw"><canvas id="cv" width="320" height="440"></canvas>${lv?`<div class="lv l">${lv.l.map((z,i)=>`<div style="animation-delay:${i*.5}s">${z}</div>`).join('')}</div><div class="lv r">${lv.r.map((z,i)=>`<div style="animation-delay:${1+i*1.2}s">${esc(z)}</div>`).join('')}</div>`:''}</div><div id="ctrl" class="ctrl"><div class="dp">${pd('u','ArrowUp','▲')}${pd('l','ArrowLeft','◀')}${pd('r','ArrowRight','▶')}${pd('d','ArrowDown','▼')}</div><div id="ctl">${isSp?B('Chutar','p','act()'):a?B('Disparar','p','act()')+B('Vaselina','','act(\'lob\')')+B('Pasar','','pass()')+B('Regate','','dribble()'):k?B('Estirada','p','act()'):g.k==='cross'?B('Despejar','p','act()'):B('Entrada','p','act()')}</div></div><p class="mu" style="text-align:center;margin:6px 0">Botones, arrastrar el dedo o teclado (flechas/WASD · Espacio, Q, E, R)</p>`}
function resH(){const m=S.m,r=m.gf>m.ga?'Victoria':m.gf<m.ga?'Derrota':'Empate';
return `<div class="c"><div class="mu">${m.eu?S.eu.n:m.po?'Play-off de ascenso':'Final del partido'}</div><div class="sc">${esc(S.club)} ${m.gf} – ${m.ga} ${esc(m.opp)}</div><div style="text-align:center"><b>${r}</b>${m.po&&m.pen!==null?' · '+(m.pen?'ganáis':'perdéis')+' en los penaltis':''}</div></div>${m.skip?'<div class="c">Te has perdido el partido.</div>':`<div class="c"><h2>Tu actuación: ${m.rt.toFixed(1)}</h2><div class="mu">${m.pg} goles · ${m.pa} asistencias</div>${m.log.map(x=>`<div class="lg"><div class="mu">Min. ${x.m} · ${esc(x.q)}</div><b class="${x.ok?'ok':'ko'}">${x.t}</b></div>`).join('')}</div>`}${S.m.lv?livePanel(90,S.m.lv)+'<div class="mu" style="margin:6px 0">Ahora eres '+(standings(S.tier).indexOf(me())+1)+'º</div>':''}<button class="p" onclick="next()">Continuar</button>`}
function evH(){const e=S.ev;return `<div class="c"><h2>Evento</h2><p>${esc(e.q)}</p>${e.res?`<p><b>${esc(e.res)}</b></p><button class="p" onclick="save();go('hub')">Continuar</button>`:e.c.map((c,j)=>`<button onclick="evPick(${j})">${esc(c[0])}</button>`).join('')}</div>${chips()}`}
function seasonH(){const e=S.end;let msg;
if(e.stage==='semi')msg=`<p>Has acabado ${e.pos+1}º y juegas el <b>play-off de ascenso</b> (del 3º al 6º). Semifinal contra ${esc(e.poOpp)}.</p><button class="p" onclick="startMatch('${e.poOpp}')">Jugar la semifinal</button>`;
else if(e.stage==='final')msg=`<p>¡Pasas a la <b>final del play-off</b>! Rival: ${esc(e.w2)}.</p><button class="p" onclick="startMatch('${e.w2}')">Jugar la final</button>`;
else{const t=e.champ?'¡Campeón de Liga! Has llegado a lo más alto.':e.promo?'¡ASCENSO a '+TIERS[S.tier-1]+(e.stage==='done'?' por el play-off!':'!'):e.rel?'Descenso a '+TIERS[S.tier+1]+'. Toca levantarse.':e.stage==='done'?'Eliminados en el play-off: os quedáis en '+TIERS[S.tier]+'.':'Temporada completada: os mantenéis en '+TIERS[S.tier]+'.';
msg=`<h2>${t}</h2><button class="p" onclick="newSeason()">Siguiente temporada</button>`}
return `<h1>Fin de temporada ${S.season}</h1><div class="c">${msg}</div><div class="c"><h2>Clasificación final</h2>${tblOf(S.tier)}</div>`}
function cineH(){return `<canvas id="cv" width="320" height="440"></canvas><div class="c" style="margin-top:10px;min-height:72px"><p id="cap" style="margin:0"></p></div><button class="p" onclick="cineNext()">Siguiente</button><button onclick="cineSkip()">Saltar</button>`}
function euroH(){const u=S.eu,R3=['Cuartos de final','Semifinales','Final'];
if(u.done)return `<h1>${u.n}</h1><div class="c"><h2>${u.champ?'¡CAMPEONES DE EUROPA!':'Eliminados en '+R3[u.r].toLowerCase()}</h2><p class="mu">${u.champ?'Tu nombre pasa a la historia del club.':'Habrá más oportunidades.'}</p><button class="p" onclick="euroDone()">Continuar</button></div>`;
return `<h1>${u.n}</h1><div class="c"><h2>${R3[u.r]}</h2><p>Rival: <b>${esc(u.opps[u.r].n)}</b> <span class="mu">(nivel ${Math.round(u.opps[u.r].s)})</span></p><button class="p" onclick="startMatch(null,S.eu.opps[S.eu.r])">Jugar</button></div>`}
function socialH(){const f=S.fol,lv=f>=20000?'Estrella mundial':f>=5000?'Famoso':f>=1000?'Conocido':'Promesa local',h=S.name.toLowerCase().replace(/[^a-z0-9]/g,'')||'jugador';
return `<h1>Redes sociales</h1><div class="c"><h2>@${h}${S.num}</h2><div class="row"><div class="chip">Seguidores<b>${f.toLocaleString('es')}</b></div><div class="chip">Fama<b>${S.rep}</b></div></div><div class="mu" style="margin-top:6px">${lv}</div></div>${S.dm.length?`<div class="c"><h2>Mensajes directos</h2>${S.dm.map((d,i)=>`<p>${esc(d.q)}</p>${d.o.map((o,j)=>`<button onclick="dmPick(${i},${j})">${esc(o[0])}</button>`).join('')}`).join('<hr style="border-color:#262626;margin:12px 0">')}</div>`:''}<div class="c"><h2>Publicar</h2>${S.posted?'<div class="mu">Ya has publicado esta jornada. Juega el próximo partido para volver a publicar.</div>':S.po.map(j=>`<button onclick="post(${j})">${PS[j][0]}</button>`).join('')}</div><div class="c"><h2>Actividad</h2>${S.feed.length?S.feed.map(x=>`<div class="lg"><div class="mu">${esc(x.t)}</div>${esc(x.x)}</div>`).join(''):'<div class="mu">Todavía no hay actividad. Juega un partido.</div>'}</div><button class="p" onclick="go('hub')">Volver</button>`}
function editH(){const cur=S.col||COLS[0];
return `<h1>Editar personaje</h1><div class="c"><h2>Nombre</h2><input id="en" maxlength="20" value="${esc(S.name)}"><h2 style="margin-top:12px">Dorsal (1–99)</h2><input id="enum" type="number" min="1" max="99" value="${S.num}"><h2 style="margin-top:12px">Posición</h2><div class="tabs">${Object.keys(POS).map(q=>`<button class="${q===S.pos?'sel':''}" onclick="keepEd();S.pos='${q}';render()">${POS[q]}</button>`).join('')}</div><h2 style="margin-top:12px">Color de camiseta</h2><div class="tabs">${COLS.map(c=>`<button style="background:${c};height:40px;${c===cur?'outline:3px solid #fff':''}" onclick="keepEd();S.col='${c}';render()"></button>`).join('')}</div></div><button class="p" onclick="keepEd();save();go('hub')">Guardar</button>`}
function marketH(){const cur=S.con||{yrs:0,sal:0},lr=S.hist.length?S.hist[S.hist.length-1].r:6,rs=Math.round(conSal(S.tier,S.ovr)*(lr>=6.5?1.1:.9));
return `<h1>Mercado de verano</h1><div class="mu">Temporada ${S.season} · ${esc(S.club)} (${TIERS[S.tier]})</div><div class="c"><h2>Seguir en ${esc(S.club)}</h2><div class="mu">${cur.yrs>0?'Te quedan '+cur.yrs+(cur.yrs===1?' año':' años')+' de contrato.':'Tu contrato ha terminado.'}</div><button onclick="signStay(${rs})">Renovar: 2 años · ${mny(rs)}/año</button></div><div class="c"><h2>Ofertas</h2>${S.offers.length?S.offers.map((o,i)=>`<button onclick="signNew(${i})"><b>${esc(o.c)}</b> · ${TIERS[o.t]}<br><span class="mu">${o.y} ${o.y>1?'años':'año'} · ${mny(o.sal)}/año</span></button>`).join(''):'<div class="mu">Sin ofertas este verano.</div>'}</div><button class="p" onclick="signStay(0)">${cur.yrs>0?'Mantener mi contrato':'Seguir sin renovar'}</button>`}
function render(){cancelAnimationFrame(raf);const A=$('#app');if(!S){A.innerHTML=startH();return}
A.innerHTML=({hub:hubH,tables:tablesH,stats:statsH,intro:introH,play:playH,result:resH,event:evH,season:seasonH,cine:cineH,euro:euroH,social:socialH,edit:editH,market:marketH})[S.screen]();
window.scrollTo(0,0);if(S.screen==='play')initScene();if(S.screen==='cine')initCine()}
S=load();if(S&&(!S.L||S.L[0].t.length!==20||S.L[1].t.length!==22))S=null;if(S)S.live=null;if(S&&!S.dm)S.dm=[];if(S&&!S.po)S.po=pickPosts();if(S&&S.cash===undefined)S.cash=0;if(S&&!S.con)S.con={yrs:2,sal:conSal(S.tier,S.ovr)};if(S&&!S.offers)S.offers=[];if(S&&S.screen==='market'&&!S.offers.length)S.offers=mkOffers(6.5);if(S&&S.diff===undefined)S.diff=1;if(S&&S.end&&!S.end.stage)S.end.stage='none';if(S&&S.fol===undefined){S.fol=150;S.feed=[];S.posted=0}if(S&&!S.trophies)S.trophies=[];if(S&&!S.col)S.col=COLS[0];if(S&&S.deb===undefined)S.deb=(S.hist.length||S.wk)?1:0;if(S&&(S.screen==='play'||S.screen==='intro'||S.screen==='cine'))S.screen='hub';render();
</script></body></html>
